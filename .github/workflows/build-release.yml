name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Windows x64 DLL
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install verified Zig compiler
        run: ./ci/install-zig.ps1
      - name: Build DLL
        run: ./build.ps1
      - name: Test adaptive snapshots, directory loading and windows
        run: ./tests/run-ci.ps1 -ZigPath ./toolchain/zig-0.16.0/ziglang/zig.exe
      - name: Verify exports and adaptive policy
        run: python ./tools/verify_build.py
      - name: Package tested release files
        run: |
          $releaseVersion = '0.2.0'
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { $releaseVersion = $env:GITHUB_REF_NAME.Substring(1) }
          python ./tools/package_release.py --version $releaseVersion --commit "$env:BUILD_COMMIT"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OopzGuard-windows-x64
          path: |
            dist/OopzGuard-*-windows.zip
            dist/OopzGuard-*-source.zip
            dist/dwmapi.dll
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OopzGuard-test-diagnostics
          path: |
            dist/ci-test-results.json
            dist/build-verification.json
          if-no-files-found: ignore

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download files from the successful build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OopzGuard-windows-x64
          path: dist
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_flags=(--prerelease=false --latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags=(--prerelease --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/OopzGuard-*-windows.zip dist/OopzGuard-*-source.zip dist/dwmapi.dll dist/SHA256SUMS.txt dist/build-info.json --clobber
            gh release edit "$RELEASE_TAG" --title "OopzGuard $RELEASE_TAG" --notes-file docs/release-notes.md "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" dist/OopzGuard-*-windows.zip dist/OopzGuard-*-source.zip dist/dwmapi.dll dist/SHA256SUMS.txt dist/build-info.json --verify-tag --title "OopzGuard $RELEASE_TAG" --notes-file docs/release-notes.md "${release_flags[@]}"
          fi
